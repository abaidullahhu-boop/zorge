<svg width="980" height="653" viewBox="0 0 980 653" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Map of Dayim projects near Raiwind Road and Ring Road, Lahore">
  <rect width="980" height="653" fill="#050505"/>

  <!-- Soft atmospheric glow -->
  <ellipse cx="490" cy="340" rx="420" ry="280" fill="#121212"/>
  <ellipse cx="520" cy="300" rx="180" ry="140" fill="#181818"/>

  <!-- Minor grid / secondary roads -->
  <g stroke="#2a2a2a" stroke-width="1" fill="none">
    <path d="M40 90 H940"/>
    <path d="M40 160 H940"/>
    <path d="M40 230 H940"/>
    <path d="M40 300 H940"/>
    <path d="M40 370 H940"/>
    <path d="M40 440 H940"/>
    <path d="M40 510 H940"/>
    <path d="M40 580 H940"/>
    <path d="M80 40 V620"/>
    <path d="M160 40 V620"/>
    <path d="M240 40 V620"/>
    <path d="M320 40 V620"/>
    <path d="M400 40 V620"/>
    <path d="M480 40 V620"/>
    <path d="M560 40 V620"/>
    <path d="M640 40 V620"/>
    <path d="M720 40 V620"/>
    <path d="M800 40 V620"/>
    <path d="M880 40 V620"/>
  </g>

  <!-- Curved secondary roads -->
  <g stroke="#3a3a3a" stroke-width="1.2" fill="none" stroke-linecap="round">
    <path d="M60 520 C180 480, 280 420, 360 340 C420 280, 460 200, 520 120"/>
    <path d="M200 620 C280 540, 340 460, 420 400 C500 330, 600 280, 720 250"/>
    <path d="M100 200 C220 220, 340 260, 420 320 C500 390, 580 480, 700 560"/>
    <path d="M780 80 C740 180, 700 280, 720 380 C740 480, 800 540, 900 580"/>
    <path d="M40 380 C160 360, 260 340, 340 300 C420 250, 500 180, 620 140"/>
  </g>

  <!-- RING ROAD (major dual carriageway, gold tint) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-20 280 C120 240, 260 200, 400 220 C540 240, 680 300, 820 360 C900 400, 960 440, 1020 480" stroke="#1a1610" stroke-width="18"/>
    <path d="M-20 280 C120 240, 260 200, 400 220 C540 240, 680 300, 820 360 C900 400, 960 440, 1020 480" stroke="#c4a574" stroke-width="2.2" opacity="0.85"/>
    <path d="M-20 292 C120 252, 260 212, 400 232 C540 252, 680 312, 820 372 C900 412, 960 452, 1020 492" stroke="#c4a574" stroke-width="1.4" opacity="0.55"/>
  </g>

  <!-- RAIWIND ROAD -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M180 -20 C260 80, 320 180, 380 280 C440 380, 500 480, 560 580 C590 640, 620 700, 650 760" stroke="#1a1610" stroke-width="16"/>
    <path d="M180 -20 C260 80, 320 180, 380 280 C440 380, 500 480, 560 580 C590 640, 620 700, 650 760" stroke="#d8c49a" stroke-width="2" opacity="0.9"/>
    <path d="M192 -16 C270 82, 330 182, 390 282 C450 382, 510 482, 570 582" stroke="#d8c49a" stroke-width="1.2" opacity="0.45"/>
  </g>

  <!-- DEFENSE ROAD -->
  <g fill="none" stroke-linecap="round">
    <path d="M700 -10 C680 90, 640 200, 600 300 C560 400, 500 500, 420 600 C380 650, 340 700, 300 740" stroke="#222" stroke-width="10"/>
    <path d="M700 -10 C680 90, 640 200, 600 300 C560 400, 500 500, 420 600" stroke="#9a9a9a" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- Local connector near projects -->
  <path d="M420 260 C480 280, 540 300, 600 290 C660 280, 720 250, 780 220" stroke="#555" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M450 340 C510 360, 570 370, 640 350" stroke="#444" stroke-width="1.5" fill="none"/>

  <!-- Junction highlight -->
  <circle cx="430" cy="300" r="28" fill="none" stroke="#c4a574" stroke-width="1" opacity="0.25"/>
  <circle cx="430" cy="300" r="8" fill="#c4a574" opacity="0.15"/>

  <!-- Area labels -->
  <g fill="#e8e8e8" font-family="Gilroy, system-ui, sans-serif" letter-spacing="0.08em">
    <text x="120" y="120" font-size="13" font-weight="600" opacity="0.75">LDA AVENUE</text>
    <text x="70" y="250" font-size="12" font-weight="600" opacity="0.55">CANAL GARDENS</text>
    <text x="200" y="480" font-size="14" font-weight="700" opacity="0.85">VALENCIA</text>
    <text x="720" y="130" font-size="14" font-weight="700" opacity="0.85">LAKE CITY</text>
    <text x="780" y="420" font-size="13" font-weight="600" opacity="0.7">BAHRIA ORCHARD</text>
    <text x="820" y="560" font-size="12" font-weight="600" opacity="0.55">ADDA PLOT</text>
    <text x="560" y="520" font-size="11" font-weight="600" opacity="0.45">AL-KABIR TOWN</text>
  </g>

  <!-- Road labels -->
  <g fill="#c4a574" font-family="Gilroy, system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.14em">
    <text x="250" y="210" transform="rotate(-18 250 210)" opacity="0.9">RING ROAD</text>
    <text x="300" y="160" transform="rotate(52 300 160)" opacity="0.95">RAIWIND ROAD</text>
    <text x="620" y="180" transform="rotate(68 620 180)" opacity="0.65">DEFENSE ROAD</text>
  </g>

  <!-- Subtle landmark dots (visual only; interactive markers are HTML) -->
  <g fill="#666">
    <circle cx="150" cy="180" r="2.5"/>
    <circle cx="860" cy="200" r="2.5"/>
    <circle cx="300" cy="560" r="2.5"/>
  </g>
</svg>
