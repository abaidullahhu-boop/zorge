# Nginx site for the static Vite build. setup-server.sh installs this as
# /etc/nginx/sites-available/dayim; certbot later adds the HTTPS block in place.
server {
    listen 80;
    listen [::]:80;
    server_name dayimdevelopers.com www.dayimdevelopers.com;

    # deploy.sh points this symlink at the newest release.
    root /var/www/dayim/current;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Vite's hashed output plus public/assets; same policy as vercel.json.
    # add_header in a location drops the server-level ones, so repeat them.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
        try_files $uri =404;
    }

    # Revalidate the HTML shell so a new deploy shows up on the next load.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA fallback for react-router routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
